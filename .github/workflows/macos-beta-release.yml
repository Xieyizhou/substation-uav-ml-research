name: macOS unsigned Beta release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Beta version without a leading v
        required: true
        default: 0.5.0
        type: string

permissions:
  contents: write

jobs:
  package:
    name: Build verifiable unsigned Beta
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Swift tests
        run: swift test --package-path apps/macos/SandboxApp

      - name: Build unsigned Beta
        run: ./scripts/package_macos_beta.sh "${{ inputs.version }}"

      - name: Verify bundle and release identities
        run: |
          codesign --verify --deep --strict --verbose=2 "dist/UAV Research Sandbox.app"
          cd dist/releases
          shasum -a 256 -c "UAV-Research-Sandbox-v${{ inputs.version }}-macos-"*"-SHA256SUMS"

      - name: Publish unsigned Beta prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "macos-beta-v${{ inputs.version }}"
          dist/releases/UAV-Research-Sandbox-v${{ inputs.version }}-macos-*.zip
          dist/releases/UAV-Research-Sandbox-v${{ inputs.version }}-macos-*.dmg
          dist/releases/UAV-Research-Sandbox-v${{ inputs.version }}-macos-*-release.json
          dist/releases/UAV-Research-Sandbox-v${{ inputs.version }}-macos-*-SHA256SUMS
          --target "${{ github.sha }}"
          --title "UAV Research Sandbox unsigned macOS Beta v${{ inputs.version }}"
          --notes "Unsigned Beta: integrity-verified and ad-hoc signed, but not Apple-notarized. See the included installation note."
          --prerelease
