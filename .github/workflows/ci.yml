name: Offline validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sandbox-demo:
    name: Sandbox demo · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Initialize dependency-free demo profile
        run: python main.py sandbox --profile demo bootstrap

      - name: Check dependency-free desktop launcher
        run: ./scripts/run_sandbox_app.sh --help

      - name: Check deterministic format fixtures without third-party packages
        run: python examples/generate_fixtures.py --check

      - name: Check published historical case excerpts without third-party packages
        run: python scripts/verify_case_studies.py

      - name: Verify receipts and reject altered output without third-party packages
        run: >-
          python examples/receipt_check/run.py
          --output outputs/examples/receipt-check-stdlib

      - name: Compile all sources including historical research (Python 3.12+)
        if: matrix.python-version == '3.13'
        run: python -m compileall -q src scripts archive main.py

      - name: Run Sandbox v0.1 release gate
        run: >-
          python main.py sandbox --profile demo release-gate
          --output outputs/sandbox/demo/release-gate/ci

      - name: Inspect release receipt
        run: >-
          python main.py sandbox --profile demo release-gate-inspect
          --input outputs/sandbox/demo/release-gate/ci/release_gate.json

      - name: Run clean-install Beta gate
        run: >-
          python main.py sandbox --profile demo beta-install-gate
          --output outputs/sandbox/demo/beta-install/ci

      - name: Inspect Beta installation receipt
        run: >-
          python main.py sandbox --profile demo beta-install-gate-inspect
          --input outputs/sandbox/demo/beta-install/ci/beta_install_gate.json

  offline-validation:
    name: Portable core · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
            requirements-offline.txt

      - name: Set up Node for executable JavaScript contract checks
        uses: actions/setup-node@v6
        with:
          node-version: "26.4.0"
          package-manager-cache: false

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Run portable core tests
        run: python scripts/run_tests.py --suite core --report outputs/core-tests.json

      - name: Compile portable core sources
        run: python -m compileall -q src main.py scripts/run_tests.py scripts/export_source.py

      - name: Check all flight shell syntax
        run: |
          bash -n scripts/run_sandbox_app.sh
          sh -n scripts/build_macos_app.sh
          sh -n scripts/package_macos_release.sh
          for script in scripts/flight/*.sh scripts/flight/experiments/*.sh; do
            bash -n "$script"
          done

      - name: Run offline A-star preview smoke test
        env:
          MPLBACKEND: Agg
        run: >-
          python main.py astar preview
          --obstacle-config config/substation_obstacles.json
          --return-home
          --altitude 1.5

  offline-examples:
    name: Source bundle and offline examples · ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-offline.txt

      - name: Export tracked source and verify unpacked manifest identity
        run: |
          python scripts/export_source.py --output outputs/source.zip
          unzip -q outputs/source.zip -d outputs/source-copy
          python - <<'PY'
          import json
          from pathlib import Path
          from src.sandbox.source_bundle import describe_source, source_paths, source_revision
          root = Path.cwd()
          unpacked = root / "outputs/source-copy"
          manifest, provenance = describe_source(source_paths(root), source_revision(root))
          assert json.loads((unpacked / "SOURCE_MANIFEST.json").read_text()) == manifest
          assert json.loads((unpacked / "SOURCE_PROVENANCE.json").read_text()) == provenance
          assert len(source_paths(unpacked)) == len(manifest)
          assert source_revision(unpacked) == provenance["source_commit_sha"]
          print("Verified", len(manifest), "source files", provenance["source_manifest_sha256"])
          PY

      - name: Install only lightweight example dependencies
        run: python -m pip install -r requirements-offline.txt

      - name: Run examples from the unpacked source bundle
        working-directory: outputs/source-copy
        run: |
          python examples/generate_fixtures.py --check
          python examples/dataset_audit/run.py --output outputs/examples/dataset-audit
          python examples/prediction_comparison/run.py --output outputs/examples/prediction-comparison
          python examples/receipt_check/run.py --output outputs/examples/receipt-check
          python examples/receipt_check/run.py --receipt outputs/examples/dataset-audit/receipt.json
          python examples/receipt_check/run.py --receipt outputs/examples/prediction-comparison/receipt.json

  macos-app:
    name: Native macOS App
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run Swift tests
        run: ./scripts/test_macos_app.sh

      - name: Build local application bundle
        run: ./scripts/build_macos_app.sh release

      - name: Validate bundle metadata and signature
        run: |
          plutil -lint "dist/UAV Research Sandbox.app/Contents/Info.plist"
          test -f "dist/UAV Research Sandbox.app/Contents/Resources/AppIcon.icns"
          codesign --verify --deep --strict "dist/UAV Research Sandbox.app"

      - name: Validate preview packaging
        run: |
          version=$(python3 -c 'import json; print(json.load(open("config/sandbox/version.json"))["macos_app_version"])')
          ./scripts/package_macos_release.sh "$version"
          cd dist/releases
          shasum -a 256 -c "UAV-Research-Sandbox-v${version}-macos-$(uname -m)-SHA256SUMS"
